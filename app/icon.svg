<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#bfc6e3" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#bfc6e3" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#bfc6e3" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Glow ring -->
  <circle cx="256" cy="256" r="220" fill="url(#glow)"/>
  <!-- Outer circle — soft halo -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#bfc6e3" stroke-width="12"/>
  <!-- Inner circle — brand blue -->
  <circle cx="256" cy="256" r="100" fill="#030d8d"/>
</svg>
